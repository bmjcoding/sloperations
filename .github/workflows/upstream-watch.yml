# Opens an issue when an upstream skill that this repo ports by hand changes
# (upstream/watch.json). It only calls the GitHub API: it never downloads or
# runs upstream code, and never commits. Skipped on mirrors outside github.com,
# where the upstream repositories may be unreachable.
name: upstream-watch

on:
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: upstream-watch
  cancel-in-progress: false

jobs:
  watch:
    name: Compare watched paths with their pins
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Update one issue per watched upstream
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: upstream/watch.sh
