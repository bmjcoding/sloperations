# Tracks the vendored agent skills against their upstreams (tooling/skill-sync).
#
# `evaluate` runs upstream code (each fork's verify command runs upstream's own
# tests), so it gets a read-only token and no secrets. `report` never runs
# repository or upstream code: inline shell, gh and jq turn the evaluation's
# JSON into one issue per fork. CI never commits or pushes; the owner adopts a
# candidate locally with `skill-sync bump` and signs the commit.
name: upstream-skills

on:
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: upstream-skills
  cancel-in-progress: false

jobs:
  evaluate:
    name: Verify, check and watch
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Test skill-sync
        run: python3 -B -m unittest discover -s tooling/skill-sync/tests -t tooling/skill-sync/tests
      # Verify commands run upstream's own tests. Locally they run in an OS sandbox
      # (sandbox-exec, bwrap, docker/podman); here they run unsandboxed on purpose:
      # ubuntu runners ship no bubblewrap and AppArmor blocks the unprivileged user
      # namespaces it needs, and this runner is disposable, holds no secrets and
      # only a read-only token. SKILL_SYNC_SANDBOX=none keeps the choice explicit
      # instead of falling through to docker. The scrubbed environment, fresh
      # HOME/TMPDIR and process-group cleanup still apply.
      - name: Verify committed outputs, then check and watch each fork
        env:
          SKILL_SYNC_CACHE: ${{ runner.temp }}/skill-sync-cache
          SKILL_SYNC_SANDBOX: none
          RESULTS: ${{ runner.temp }}/upstream-skills
        run: |
          set -u
          mkdir -p "$RESULTS/forks"
          status=0
          code=0
          tooling/skill-sync/skill-sync verify --json "$RESULTS/verify.json" || code=$?
          echo "$code" > "$RESULTS/verify.exit"
          [ "$code" -eq 0 ] || status=1
          forks=$(tooling/skill-sync/skill-sync list) || exit 1
          while IFS=$'\t' read -r name mode _; do
            [ -n "$name" ] || continue
            if [ "$mode" = rules ]; then set -- check --unsandboxed-verify; else set -- watch; fi
            echo "::group::skill-sync $1 $name"
            code=0
            tooling/skill-sync/skill-sync "$@" "$name" --json "$RESULTS/forks/$name.json" || code=$?
            echo "::endgroup::"
            echo "$code" > "$RESULTS/forks/$name.exit"
            # 0 ready/unchanged, 1 fails/changes and 3 nothing newer are results; 2 and 4 are errors.
            case "$code" in 0|1|3) ;; *) status=1 ;; esac
          done <<< "$forks"
          exit "$status"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: upstream-skills
          path: ${{ runner.temp }}/upstream-skills
          retention-days: 14
          if-no-files-found: error

  report:
    name: Update one issue per fork
    needs: evaluate
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: upstream-skills
          path: results
      - name: Create, update or close issues
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          label=upstream-skills
          launcher=tooling/skill-sync/skill-sync
          gh label create "$label" --color 5319e7 --description "skill-sync upstream tracking" >/dev/null 2>&1 || true
          failed=0

          # Text from the evaluation (upstream subjects, diffs, test output) only ever
          # appears inside a fence it can't close, so it can't mention, link or format.
          fenced() { printf '~~~~text\n'; head -c 50000 | sed 's/~~~/~ ~ ~/g'; printf '\n~~~~\n'; }

          # upsert TITLE-PREFIX TITLE BODY-FILE: one open issue per prefix; comment when the title changes.
          upsert() {
            local found number old
            found=$(gh issue list --label "$label" --state open --limit 200 --json number,title \
              --jq "map(select(.title | startswith(\"$1\"))) | .[0] | select(.) | \"\(.number)\t\(.title)\"")
            if [ -z "$found" ]; then
              gh issue create --label "$label" --title "$2" --body-file "$3" >/dev/null || failed=1
              return
            fi
            number=${found%%$'\t'*}; old=${found#*$'\t'}
            gh issue edit "$number" --title "$2" --body-file "$3" >/dev/null || failed=1
            if [ "$old" != "$2" ]; then
              gh issue comment "$number" --body "Now: $2 ($RUN_URL)" >/dev/null || failed=1
            fi
          }

          close() {
            local number
            number=$(gh issue list --label "$label" --state open --limit 200 --json number,title \
              --jq "map(select(.title | startswith(\"$1\"))) | .[0].number // empty")
            if [ -n "$number" ]; then
              gh issue close "$number" --comment "$2 ($RUN_URL)" >/dev/null || failed=1
            fi
          }

          verify_code=$(cat results/verify.exit 2>/dev/null || echo 4)
          if [ "$verify_code" = 0 ]; then
            close "skill-sync verify: " "Committed outputs match their pins and rules again."
          else
            {
              echo "<!-- skill-sync:verify -->"
              echo "\`skill-sync verify\` found committed vendored skills that differ from what their pins and rules generate (exit $verify_code)."
              echo "Regenerate with \`$launcher sync <name>\` and change \`upstream/<name>.json\` rather than the generated files."
              echo; echo "Run: $RUN_URL"; echo
              jq -r '.forks[] | "\(.name): \(.status)\n" + (.problems | join("\n"))' results/verify.json 2>/dev/null | fenced || true
            } > body.md
            upsert "skill-sync verify: " "skill-sync verify: committed skills differ from their pins" body.md
          fi

          for exit_file in results/forks/*.exit; do
            [ -e "$exit_file" ] || continue
            name=$(basename "$exit_file" .exit)
            [[ "$name" =~ ^[a-z0-9][a-z0-9-]*$ ]] || { echo "skipping unexpected result name"; continue; }
            json="results/forks/$name.json"
            code=$(cat "$exit_file"); [[ "$code" =~ ^[0-9]+$ ]] || code=4
            status=error; candidate=""; pin=""
            if [ -f "$json" ]; then
              status=$(jq -r '.status // "error"' "$json")
              candidate=$(jq -r '.candidate // ""' "$json")
              pin=$(jq -r '.pin // ""' "$json")
            fi
            [[ "$pin" =~ ^[0-9a-f]{40}$ ]] || status=error
            [[ -z "$candidate" || "$candidate" =~ ^[0-9a-f]{40}$ ]] || status=error
            # The status must agree with the exit code, or the result is treated as an error.
            case "$status:$code" in
              ready:0|fails:1|current:3|changes:1|unchanged:0) ;;
              *) status=error ;;
            esac
            if [[ "$status" =~ ^(ready|fails|changes)$ && -z "$candidate" ]]; then status=error; fi
            prefix="$name: "

            case "$status" in
              current|unchanged)
                close "$prefix" "Upstream has nothing newer than the pin ${pin:0:7} for the tracked paths."
                continue ;;
              ready)
                title="$name: upstream ${candidate:0:7} ready"
                {
                  echo "<!-- skill-sync:$name -->"
                  echo "A newer upstream commit for \`$name\` passes every strict rule, the tripwire and the fork's verify commands."
                  echo; echo "Adopt it locally, review the diff, then sign-commit:"; echo
                  echo '```sh'; echo "$launcher bump $name --to $candidate"; echo '```'
                  echo; echo "\`bump\` re-runs the whole check on your machine before it moves the pin. CI never commits."
                } > body.md ;;
              fails)
                title="$name: upstream ${candidate:0:7} fails strict rules"
                {
                  echo "<!-- skill-sync:$name -->"
                  echo "The newest upstream commit for \`$name\` breaks strict checks, so the pin stays at \`${pin:0:7}\`:"; echo
                  jq -r '.failed_strict[]' "$json" | while IFS= read -r id; do
                    if [[ "$id" =~ ^[A-Za-z0-9][A-Za-z0-9._/:-]*$ ]]; then echo "- \`$id\`"; fi
                  done
                  echo; echo "Update the rules in \`upstream/$name.json\`, then run \`$launcher check $name\` locally."
                } > body.md ;;
              changes)
                title="$name: upstream changes since ${pin:0:7} to port"
                {
                  echo "<!-- skill-sync:$name -->"
                  echo "Upstream changed files that \`$name\` ports by hand. Port what matters, then acknowledge the commits:"; echo
                  echo '```sh'; echo "$launcher bump $name --to $candidate"; echo '```'
                } > body.md ;;
              *)
                title="$name: upstream check errored"
                failed=1
                {
                  echo "<!-- skill-sync:$name -->"
                  echo "skill-sync exited $code without a usable result; see the run log."
                } > body.md ;;
            esac
            {
              echo; echo "Run: $RUN_URL"; echo
              echo "<details><summary>Report</summary>"; echo
              if [ -f "$json" ]; then jq -r '.report // ""' "$json" | fenced || true; fi
              echo; echo "</details>"
            } >> body.md
            upsert "$prefix" "$title" body.md
          done
          exit "$failed"
